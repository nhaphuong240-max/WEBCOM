name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ptt/shared-kernel build
      - run: pnpm --filter @ptt/ui build
      - run: pnpm --filter @ptt/admin-api exec prisma generate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @ptt/admin-web build
      - run: pnpm --filter @ptt/storefront-web build

  docker-api:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build admin-api image
        run: docker build -f apps/admin-api/Dockerfile -t ptt-admin-api:ci .

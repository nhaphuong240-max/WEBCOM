<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Clear-Site-Data" content="&quot;cache&quot;, &quot;storage&quot;, &quot;executionContexts&quot;" />
  <title>Themes · Xóa PWA cũ</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 48px auto; padding: 0 16px; color: #1a1214; }
    h1 { font-size: 22px; }
    a.btn {
      display: inline-block; margin-top: 12px; padding: 12px 18px; background: #c45a6a; color: #fff;
      border-radius: 8px; font-weight: 700; text-decoration: none;
    }
    code { background: #f3f5f7; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Gỡ cache PWA trên themes</h1>
  <p>Service Worker cũ khiến hiện “Bạn đang offline” dù server vẫn chạy.</p>
  <p id="status">Đang xóa Service Worker và cache…</p>
  <p><a class="btn" href="/?demo=spark-promo">Về demo Spark</a></p>
  <script>
    (async function () {
      var status = document.getElementById('status');
      try {
        if ('serviceWorker' in navigator) {
          var regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(function (r) { return r.unregister(); }));
        }
        if (window.caches) {
          var keys = await caches.keys();
          await Promise.all(keys.map(function (k) { return caches.delete(k); }));
        }
        status.textContent = 'Đã xóa. Đang mở lại demo…';
        setTimeout(function () { location.replace('/?demo=spark-promo&pwa_cleared=1'); }, 600);
      } catch (e) {
        status.textContent = 'Xóa một phần thất bại — hãy Clear site data trong trình duyệt.';
      }
    })();
  </script>
</body>
</html>

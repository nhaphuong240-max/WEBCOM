upstream webecom_storefront {
  server 127.0.0.1:3102;
  keepalive 16;
}

upstream webecom_admin_web {
  server 127.0.0.1:3100;
  keepalive 16;
}

upstream webecom_admin_api {
  server 127.0.0.1:3101;
  keepalive 16;
}

server {
  listen 80;
  listen [::]:80;
  server_name webecom.ngoinhahomnay.vn;

  client_max_body_size 20m;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location /api/ {
    proxy_pass http://webecom_admin_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Next basePath=/console — do not force trailing slash (avoids 301↔308 loop)
  location /console {
    proxy_pass http://webecom_admin_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://webecom_storefront;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

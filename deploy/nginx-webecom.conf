upstream webecom_storefront {
  server 127.0.0.1:3102;
  keepalive 16;
}

upstream webecom_admin_web {
  server 127.0.0.1:3100;
  keepalive 16;
}

upstream webecom_admin_api {
  server 127.0.0.1:3101;
  keepalive 16;
}

upstream webecom_corporate {
  server 127.0.0.1:3103;
  keepalive 8;
}

# Shared security headers (W5)
map $sent_http_content_type $security_headers {
  default 1;
}

server {
  listen 80;
  listen [::]:80;
  server_name webecom.ngoinhahomnay.vn;

  client_max_body_size 20m;

  # Checkout throttle is enforced in Nest (CheckoutRateLimitGuard).
  # Optional nginx: add `limit_req_zone $binary_remote_addr zone=checkout:10m rate=10r/s;` in http{} then:
  #   location /api/v1/checkout { limit_req zone=checkout burst=20 nodelay; ... }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location /api/ {
    proxy_pass http://webecom_admin_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Next basePath=/console — do not force trailing slash (avoids 301↔308 loop)
  location /console {
    proxy_pass http://webecom_admin_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://webecom_storefront;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# Optional corporate GTM host (W5)
server {
  listen 80;
  listen [::]:80;
  server_name ptt.ngoinhahomnay.vn corporate.webecom.ngoinhahomnay.vn;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;

  location / {
    proxy_pass http://webecom_corporate;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

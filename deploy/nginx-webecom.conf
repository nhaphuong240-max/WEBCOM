upstream webecom_storefront {
  server 127.0.0.1:3102;
  keepalive 16;
}

upstream webecom_admin_web {
  server 127.0.0.1:3100;
  keepalive 16;
}

upstream webecom_admin_api {
  server 127.0.0.1:3101;
  keepalive 16;
}

upstream webecom_corporate {
  server 127.0.0.1:3103;
  keepalive 8;
}

# Shared security headers (W5)
map $sent_http_content_type $security_headers {
  default 1;
}

# ——— Apex = Platform GTM (corporate-web) ———
server {
  listen 80;
  listen [::]:80;
  server_name webecom.ngoinhahomnay.vn;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  listen [::]:443 ssl;
  server_name webecom.ngoinhahomnay.vn;

  ssl_certificate     /etc/letsencrypt/live/webecom.ngoinhahomnay.vn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/webecom.ngoinhahomnay.vn/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  client_max_body_size 20m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location /api/ {
    proxy_pass http://webecom_admin_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Next basePath=/console — do not force trailing slash
  location /console {
    proxy_pass http://webecom_admin_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Legacy shop paths → demo sandbox
  location ~ ^/(products|collections|cart|checkout|account|order|search|p)(/|$) {
    return 302 https://demo.webecom.ngoinhahomnay.vn$request_uri;
  }

  location / {
    proxy_pass http://webecom_corporate;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# ——— Demo sandbox storefront ———
server {
  listen 80;
  listen [::]:80;
  server_name demo.webecom.ngoinhahomnay.vn;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  listen [::]:443 ssl;
  server_name demo.webecom.ngoinhahomnay.vn;

  # Prefer SAN cert that includes demo.; fallback same leaf until certbot --expand
  ssl_certificate     /etc/letsencrypt/live/webecom.ngoinhahomnay.vn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/webecom.ngoinhahomnay.vn/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  client_max_body_size 20m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location /api/ {
    proxy_pass http://webecom_admin_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location / {
    proxy_pass http://webecom_storefront;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# Optional alt GTM hosts (HTTP until dedicated certs)
server {
  listen 80;
  listen [::]:80;
  server_name ptt.ngoinhahomnay.vn corporate.webecom.ngoinhahomnay.vn;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;

  location / {
    return 301 https://webecom.ngoinhahomnay.vn$request_uri;
  }
}

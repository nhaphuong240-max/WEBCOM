openapi: 3.0.3
info:
  title: WebCom C6 — NBA + Service Recovery
  version: 1.0.0
paths:
  /api/health:
    get:
      summary: wave C6
  /api/v1/admin/cx/status:
    get:
      summary: CX feature flags
  /api/v1/admin/cx/tickets:
    get:
      summary: List service tickets
    post:
      summary: Create ticket
  /api/v1/admin/cx/tickets/{id}:
    get:
      summary: Ticket detail + NBA
    patch:
      summary: Update status/owner/draft
  /api/v1/admin/cx/tickets/{id}/care-reply:
    post:
      summary: AI care_reply → pending_approval (BR-018)
  /api/v1/admin/cx/playbooks/scan:
    post:
      summary: Scan delay_cod / fail_payment / negative_keyword
  /api/v1/admin/cx/nba/suggest:
    post:
      summary: Rule-based NBA recommendations
  /api/v1/admin/cx/nba/suggest-ai:
    post:
      summary: AI nba_suggest → pending_approval
  /api/v1/admin/cx/nba:
    get:
      summary: List NBA
  /api/v1/admin/cx/nba/{id}:
    patch:
      summary: Accept / dismiss / assign owner
  /api/v1/admin/cx/nba/{id}/apply:
    post:
      summary: Apply stub (tag/voucher stub) — never refund
  /api/v1/admin/ai/actions/{id}/review:
    post:
      summary: Approve/reject high-risk AI
  /api/v1/admin/ai/actions/{id}/apply:
    post:
      summary: Apply care draft or materialize NBA

openapi: 3.0.3
info:
  title: WebCom Platform CMS (GA · CORP-CMS-2)
  version: 2.0.0
  description: |
    Platform CMS for corporate GTM pages (ADR-008 interim Storefront).
    Permissions: platform.cms.read | write | publish.
    Nested slugs (solutions/website) must be URL-encoded in path segments.
paths:
  /api/v1/admin/platform/sites:
    get:
      summary: List platform sites
      security: [{ TenantAuth: [] }]
      responses:
        '200': { description: Site list }
  /api/v1/admin/platform/sites/{siteKey}:
    get:
      summary: Site meta
      parameters:
        - { in: path, name: siteKey, required: true, schema: { type: string, example: webcom_apex } }
      responses:
        '200': { description: Site meta }
  /api/v1/admin/platform/starters:
    get:
      summary: List GTM starters (home/pricing/catalog/solution/industry/case)
      responses:
        '200': { description: Starters }
  /api/v1/admin/platform/sites/{siteKey}/pages:
    get:
      summary: List pages
      parameters:
        - { in: path, name: siteKey, required: true, schema: { type: string } }
      responses:
        '200': { description: Pages }
  /api/v1/admin/platform/sites/{siteKey}/pages/{slug}:
    get:
      summary: Get draft + version history
      parameters:
        - { in: path, name: siteKey, required: true, schema: { type: string } }
        - { in: path, name: slug, required: true, schema: { type: string }, description: URL-encoded slug }
      responses:
        '200': { description: Draft with versions[] }
    put:
      summary: Save draft (ContentV1)
      parameters:
        - { in: path, name: siteKey, required: true, schema: { type: string } }
        - { in: path, name: slug, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                title: { type: string }
                content: { type: object }
                seo: { type: object }
                expected_version: { type: number }
                template_key: { type: string }
      responses:
        '200': { description: Saved }
        '400': { description: Invalid CTA / schema }
  /api/v1/admin/platform/sites/{siteKey}/pages/{slug}/transition:
    post:
      summary: draft → review → published (case KPI gate on publish)
      parameters:
        - { in: path, name: siteKey, required: true, schema: { type: string } }
        - { in: path, name: slug, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target: { type: string, enum: [draft, review, published] }
                checklist:
                  type: object
                  properties:
                    seo_ok: { type: boolean }
                    cta_codes_ok: { type: boolean }
                    legal_ok: { type: boolean }
                publish_at:
                  type: string
                  description: ISO datetime — future → status scheduled (PC3-5)
      responses:
        '200': { description: Transitioned (or scheduled) }
        '400': { description: Checklist / case KPI gate }
        '403': { description: Missing publish permission }
  /api/v1/admin/platform/sites/{siteKey}/pages/{slug}/rollback:
    post:
      summary: Rollback to version N and re-publish (AC-P3)
      parameters:
        - { in: path, name: siteKey, required: true, schema: { type: string } }
        - { in: path, name: slug, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, minimum: 1 }
      responses:
        '200': { description: Rolled back + revalidate triggered }
        '403': { description: Requires platform.cms.publish }
  /api/v1/admin/platform/sites/{siteKey}/nav:
    get:
      summary: List navigation menus
      parameters:
        - { in: path, name: siteKey, required: true, schema: { type: string } }
      responses:
        '200': { description: Menus }
  /api/v1/admin/platform/sites/{siteKey}/nav/{handle}:
    put:
      summary: Upsert header|footer|bottom nav
      parameters:
        - { in: path, name: siteKey, required: true, schema: { type: string } }
        - { in: path, name: handle, required: true, schema: { type: string, enum: [header, footer, bottom] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [label, href]
                    properties:
                      label: { type: string }
                      href: { type: string }
      responses:
        '200': { description: Upserted }
  /api/v1/admin/platform/sites/{siteKey}/preview-token:
    post:
      summary: Preview token (AC-P7)
      responses:
        '200': { description: token + preview_url }
  /api/v1/public/platform/{siteKey}/pages/{slug}:
    get:
      summary: Published page (no auth)
      parameters:
        - { in: path, name: siteKey, required: true, schema: { type: string } }
        - { in: path, name: slug, required: true, schema: { type: string } }
      responses:
        '200': { description: Published ContentV1 }
        '404': { description: Not published }
  /api/v1/public/platform/{siteKey}/nav:
    get:
      summary: Public header/footer menus
      parameters:
        - { in: path, name: siteKey, required: true, schema: { type: string } }
      responses:
        '200': { description: Nav map by handle }
  /api/v1/public/platform/{siteKey}/preview:
    get:
      summary: Draft preview via token
      parameters:
        - { in: path, name: siteKey, required: true, schema: { type: string } }
        - { in: query, name: token, required: true, schema: { type: string } }
        - { in: query, name: slug, schema: { type: string, default: home } }
      responses:
        '200': { description: Preview ContentV1 }
  /api/v1/admin/platform/sites/{siteKey}/flush-scheduled:
    post:
      summary: Promote due scheduled versions to published (PC3-5)
      parameters:
        - { in: path, name: siteKey, required: true, schema: { type: string } }
      responses:
        '200': { description: flushed[] }
  /api/v1/leads:
    post:
      summary: Corporate lead (+ optional gated unlock)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name: { type: string }
                email: { type: string }
                consent: { type: boolean }
                cta_code: { type: string }
                landing_slug: { type: string }
                unlock_href:
                  type: string
                  description: Relative path or https URL unlocked after lead (CORP-CMS-3)
      responses:
        '200':
          description: '{ id, unlocked, unlock_href }'
        '400':
          description: Consent / invalid unlock_href
components:
  securitySchemes:
    TenantAuth:
      type: apiKey
      in: header
      name: x-tenant-id
      description: Also send x-actor-id (AUTH_DEV_BYPASS) or Bearer JWT
